<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden; }
    .header { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: #fff; padding: 40px 20px; text-align: center; }
    .content { padding: 40px 30px; }
    .button { display: inline-block; background: #f5576c; color: #fff; padding: 14px 32px; text-decoration: none; border-radius: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><h1>Password Reset 🔒</h1></div>
    <div class="content">
      <p>Hi {{name}},</p>
      <p>We received a request to reset your password. Click the button below to set a new one. This link expires in 10 minutes.</p>
      <p style="text-align: center; margin: 30px 0;">
        <a href="{{resetUrl}}" class="button">Reset Password</a>
      </p>
      <p>If you didn't request this, please ignore this email.</p>
    </div>
  </div>
</body>
</html>
